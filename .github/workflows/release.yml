name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release pull request
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Release / Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Setup / Checkout
        if: ${{ steps.release.outputs['packages/core--release_created'] == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm comes from `packageManager` and Node.js from `devEngines.runtime`,
      # and the step installs the dependencies itself.
      - name: Setup / pnpm
        if: ${{ steps.release.outputs['packages/core--release_created'] == 'true' }}
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Build / Package
        if: ${{ steps.release.outputs['packages/core--release_created'] == 'true' }}
        run: pnpm --filter @publira/comic-viewer build

      - name: Release / Publish package
        if: ${{ steps.release.outputs['packages/core--release_created'] == 'true' }}
        run: pnpm --filter @publira/comic-viewer publish --access public --no-git-checks
